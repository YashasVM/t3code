name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build standalone release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      APP_VARIANT: production
      EXPO_NO_GIT_STATUS: "1"
      CI: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Enable Corepack
        run: corepack enable

      - name: Use hoisted pnpm layout
        run: printf 'node-linker=hoisted\n' > .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --clean --platform android

      - name: Build standalone ARM64 release APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a

      - name: Locate and verify release APK
        shell: bash
        run: |
          APK="$(find apps/mobile/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Release APK was not generated"
            exit 1
          fi

          unzip -l "$APK" | grep -q 'assets/index.android.bundle' || {
            echo "The APK does not contain the bundled React Native JavaScript"
            exit 1
          }

          cp "$APK" t3code-android-arm64-release.apk
          echo "Verified standalone APK: $APK"

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: t3code-android-arm64-release-apk
          path: t3code-android-arm64-release.apk
          if-no-files-found: error
          retention-days: 14
